# Ported from nixos-config/home/tmux.nix. Plugins via TPM:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm   then prefix + I
set -g default-terminal "tmux-256color"
set -g prefix C-s
unbind C-b
bind C-s send-prefix
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 0
set -g history-limit 100000
setw -g mode-keys vi
set -g focus-events on
set -g renumber-windows on

# True colour, plus pass kitty-protocol images/clipboard through tmux.
set -as terminal-features ',*:RGB'
set -g allow-passthrough on
set -g set-clipboard on
# Modified keys (e.g. Shift+Enter in Claude Code) reach the app inside tmux.
set -s extended-keys on
set -as terminal-features ',*:extkeys'

# Splits open in the current directory.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Pane navigation with Prefix + h/j/k/l, resize with Prefix + H/J/K/L.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 2
bind K resize-pane -U 2
bind L resize-pane -R 5

# --- plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl-h/j/k/l across tmux panes and nvim splits
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix Ctrl-s / Ctrl-r
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
if "test ! -d ~/.tmux/plugins/tpm" "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# Status bar on top, transparent, Catppuccin modules. Must come AFTER the plugins load.
set -g status-position top
set -g status-style bg=default
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"
